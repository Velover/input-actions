[package]
name = "virtual-pad"
version = "0.1.0"
edition = "2024"
description = "A local HTTP service that plugs a virtual Xbox 360 pad into Windows (ViGEmBus) and injects touch, for the Studio tests of @rbxts/input-actions"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
vigem-client = "0.1.4"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
]
